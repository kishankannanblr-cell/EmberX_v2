<!DOCTYPE html>
<html>
<head>
    <title>Inspect Images</title>
    <style>
        body { font-family: sans-serif; background: #f0f0f0; padding: 20px; }
        .image-container { display: flex; flex-direction: column; gap: 20px; }
        .image-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        img { max-width: 100%; height: auto; display: block; margin-top: 10px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>Workspace Images</h1>
    <div class="image-container">
        <div class="image-card">
            <h3>image 1.jpg (2940 x 1960)</h3>
            <img src="image 1.jpg">
        </div>
        <div class="image-card">
            <h3>image 2.jpg (768 x 432)</h3>
            <img src="image 2.jpg">
        </div>
        <div class="image-card">
            <h3>image 3.jpg (1280 x 720)</h3>
            <img src="image 3.jpg">
        </div>
        <div class="image-card">
            <h3>image 4.jpg (390 x 280)</h3>
            <img src="image 4.jpg">
        </div>
        <div class="image-card">
            <h3>image 5.jpg (548 x 364)</h3>
            <img src="image 5.jpg">
        </div>
        <div class="image-card">
            <h3>image 6.jpg (672 x 456)</h3>
            <img src="image 6.jpg">
        </div>
        <div class="image-card">
            <h3>images 6.jpg (672 x 456)</h3>
            <img src="images 6.jpg">
        </div>
    </div>
</body>
</html>
